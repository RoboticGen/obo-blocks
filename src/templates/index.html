  <body>
    <div id="notification" class="notification">

    </div>
    <div class="container">
      <nav class="nav-bar">
        <img
          id="obo-blocks-logo"
          class="obo-blocks-logo"
          alt="Obo Blocks Logo"
          src="obo_blocks.webp"

            src="academyLogo.webp"

      <div class="blocky-editor" id="blocky-editor">
        <img loading="lazy" src="editing.gif" class="editing-image" id = "editing-image" alt="" style="display: none;">
        <div class="button-row">
          <p class="code-title">Visual Blocks</p>
          <div class="button-group">
            <a class="button" id="import-json-button"
              ><i class="fa fa-file-import" style="padding-right: 2px"></i>
              <span id="import-text">Import</span></a
            >
            <a class="button" id="export-json-button"
              ><i class="fa fa-file-export" style="padding-right: 4px"></i
              ><span id="export-text">Export</span></a
            >
            <a class="button" id="run-model-button"
              ><i class="fa fa-file-export" style="padding-right: 4px"></i
              ><span id="export-text">Chat Bot</span></a
            >
          </div>
        </div>
        <div class="editor" id="editor"></div>
      </div>
      <div class="code" id="code" style="min-height: 10vh">
        <div class="button-row">
          <p class="code-title">Python Code</p>
          <div class="button-group">
            <a class="button" id="edit-button"
              ><i class="fa fa-pencil" style="padding-right: 2px"></i>
              <span id="edit-text">Edit</span></a
            >
            <a class="button" id="run-button"
              ><i id="run-icon" class="fa fa-flag"></i>
              <span id="run-text">Run</span></a
            >
            <a class="button" id="copy-button"
              ><i class="fa fa-copy"></i><span id="copy-text">Copy</span></a
            >
            <a class="button" id="export-button"
              ><i class="fa fa-file-export" style="padding-right: 4px"></i
              ><span id="export-text">Export</span></a
            >
          </div>
        </div>
        <div class="code-snippet" id="code-editor"></div>
      </div>
      <div class="output" id="output">
        <div class="button-row">
          <label for="terminal-output" class="output-title">Output</label>
          <div class="button-group">
            <a class="button" id="clear-button"
              ><i id="run-clear" class="fa fa-trash"></i>
              <span id="run-text">Clear</span></a
            >
            <a class="button" id="stop-button"
              ><i id="run-clear" class="fa fa-trash"></i>
              <span id="stop-text">Stop</span></a
            >
          </div>
        </div>
        <div class="terminal-output-div">
          <textarea
            id="terminal-output"
            class="terminal-output"
            rows="10"
            readonly
          ></textarea>
        </div>
      </div>
    </div>
